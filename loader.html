<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERF/X - Loader</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#000; color:#33ff33;
            font-family:'Courier New','IBM Plex Mono','Lucida Console',monospace;
            display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden;
        }
        .crt {
            width:800px; max-width:95vw; background:#000;
            border:3px solid #444; border-radius:12px;
            box-shadow: 0 0 40px rgba(51,255,51,0.15), 0 0 80px rgba(51,255,51,0.05), inset 0 0 60px rgba(0,0,0,0.5);
            position:relative; overflow:hidden;
        }
        .crt::before {
            content:''; position:absolute; top:0; left:0; width:100%; height:100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 2px, transparent 2px, transparent 4px);
            pointer-events:none; z-index:10;
        }
        .crt::after {
            content:''; position:absolute; top:0; left:0; width:100%; height:100%;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.6) 100%);
            pointer-events:none; z-index:11;
        }
        .monitor-header {
            display:flex; align-items:center; padding:8px 16px;
            background:#1a1a1a; border-bottom:2px solid #444;
            font-size:11px; color:#999; letter-spacing:1px; text-transform:uppercase;
        }
        .monitor-header .brand { color:#33ff33; font-weight:bold; margin-right:16px; }
        .monitor-header .model { color:#666; }
        .power-led {
            width:8px; height:8px; background:#33ff33; border-radius:50%; margin-left:auto;
            box-shadow:0 0 8px #33ff33; animation:ledPulse 2s infinite;
        }
        @keyframes ledPulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .screen {
            padding:20px 24px; min-height:380px; max-height:55vh; overflow-y:auto;
            font-size:14px; line-height:1.6; position:relative; z-index:1;
        }
        .screen::-webkit-scrollbar { width:6px; }
        .screen::-webkit-scrollbar-track { background:#0a0a0a; }
        .screen::-webkit-scrollbar-thumb { background:#33ff33; border-radius:3px; }
        .line { margin-bottom:2px; white-space:pre-wrap; word-break:break-all; }
        .prompt { color:#33ff33; }
        .cursor {
            display:inline-block; width:8px; height:15px; background:#33ff33;
            animation:cursorBlink 0.6s infinite; vertical-align:middle; margin-left:2px;
        }
        @keyframes cursorBlink { 0%,100%{opacity:1} 50%{opacity:0} }
        .status-ok { color:#33ff33; }
        .status-warn { color:#ffff33; }
        .status-err { color:#ff3333; }
        .status-info { color:#33ffff; }
        .divider { color:#444; margin:8px 0; }
        .progress-container {
            margin:16px 0; border:2px solid #444; background:#0a0a0a; height:22px; position:relative; z-index:1;
        }
        .progress-bar {
            height:100%; background:#33ff33; width:0%; transition:width 0.2s;
            box-shadow:inset 0 0 10px rgba(0,0,0,0.3);
        }
        .progress-text {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            font-size:11px; color:#000; font-weight:bold; z-index:2; letter-spacing:1px;
        }
        .launch-btn {
            display:none; width:100%; margin-top:16px; padding:14px;
            background:#0a0a0a; color:#33ff33; border:2px solid #33ff33;
            font-size:14px; font-weight:bold; cursor:pointer; font-family:inherit;
            text-transform:uppercase; letter-spacing:3px; position:relative; z-index:1;
            transition: background 0.15s, color 0.15s;
        }
        .launch-btn:hover { background:#33ff33; color:#000; }
        .launch-btn.show { display:block; animation:btnPulse 1.5s infinite; }
        @keyframes btnPulse {
            0%,100%{ border-color:#33ff33; box-shadow:0 0 10px rgba(51,255,51,0.3); }
            50%{ border-color:#66ff66; box-shadow:0 0 20px rgba(51,255,51,0.6); }
        }
        .footer-status {
            display:flex; align-items:center; padding:6px 16px;
            background:#1a1a1a; border-top:2px solid #444;
            font-size:10px; color:#666; letter-spacing:1px; text-transform:uppercase; position:relative; z-index:1;
        }
        .footer-status span { margin-right:16px; }
    </style>
</head>
<body>
    <div class="crt">
        <div class="monitor-header">
            <span class="brand">SERF/X TERMINAL</span>
            <span class="model">v2.1.4 — CRT-2000</span>
            <div class="power-led"></div>
        </div>
        <div class="screen" id="screen">
            <div class="line"><span class="status-info">SERF/X BOOTSTRAP v2.1.4</span></div>
            <div class="line"><span class="status-info">Copyright (c) 1998 SerfNet Systems</span></div>
            <div class="line divider">===============================================</div>
            <div class="line"><span>Initializing system...</span></div>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>
        <button class="launch-btn" id="launchBtn">[ EXECUTE ]</button>
        <div class="footer-status">
            <span>MEM: 640K OK</span>
            <span>DISK: A:\</span>
            <span id="footerStatus">READY</span>
            <span style="margin-left:auto;">COM1: 9600-8-N-1</span>
        </div>
    </div>
    <script>
        const REPO_OWNER = 'keyler3333';
        const REPO_NAME = 'zero-day';
        const BRANCH = 'main';

        const screen = document.getElementById('screen');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const launchBtn = document.getElementById('launchBtn');
        const footerStatus = document.getElementById('footerStatus');

        const FILES = [
            { path: 'sw.js', desc: 'ROUTING ENGINE' },
            { path: 'manifest.json', desc: 'PWA CONFIG' },
            { path: 'assets/icons/icon.svg', desc: 'ICON ASSET' },
            { path: 'search-index.json', desc: 'SEARCH INDEX' }
        ];

        const CDN_BASE = `https://cdn.jsdelivr.net/gh/${REPO_OWNER}/${REPO_NAME}@${BRANCH}`;

        let loadedCount = 0;
        const loadedFiles = {};

        function typeLine(text, className, delay) {
            return new Promise((resolve) => {
                const line = document.createElement('div');
                line.className = 'line';
                const span = document.createElement('span');
                span.className = className || '';
                line.appendChild(span);
                screen.appendChild(line);
                screen.scrollTop = screen.scrollHeight;

                let i = 0;
                const cursor = document.createElement('span');
                cursor.className = 'cursor';
                line.appendChild(cursor);

                function type() {
                    if (i < text.length) {
                        span.textContent += text.charAt(i);
                        i++;
                        setTimeout(type, delay || 15);
                    } else {
                        cursor.remove();
                        resolve();
                    }
                }
                type();
            });
        }

        function logInstant(text, className) {
            const line = document.createElement('div');
            line.className = 'line';
            const span = document.createElement('span');
            span.className = className || '';
            span.textContent = text;
            line.appendChild(span);
            screen.appendChild(line);
            screen.scrollTop = screen.scrollHeight;
        }

        function updateProgress(percent) {
            progressBar.style.width = percent + '%';
            progressText.textContent = percent + '%';
        }

        async function loadFile(file) {
            const url = CDN_BASE + '/' + file.path;
            await typeLine('  FETCHING ' + file.path + ' ...', '', 10);
            footerStatus.textContent = 'FETCHING';

            try {
                const response = await fetch(url, { cache: 'no-cache', mode: 'cors' });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const content = await response.text();
                loadedFiles[file.path] = content;
                logInstant('  [' + file.desc + ']', 'status-ok');
                logInstant('  SIZE: ' + content.length + ' bytes', '');
                logInstant('  STATUS: OK', 'status-ok');
                logInstant('', '');
                loadedCount++;
                updateProgress(Math.floor((loadedCount / (FILES.length + 1)) * 100));
                footerStatus.textContent = 'OK';
                return true;
            } catch (err) {
                logInstant('  ERROR: ' + err.message, 'status-err');
                logInstant('  STATUS: FAILED', 'status-err');
                logInstant('', '');
                footerStatus.textContent = 'ERR';
                return false;
            }
        }

        async function loadIndexPage() {
            await typeLine('  FETCHING index.html ...', '', 10);
            footerStatus.textContent = 'FETCHING';
            try {
                const response = await fetch(CDN_BASE + '/index.html', { cache: 'no-cache', mode: 'cors' });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const html = await response.text();
                logInstant('  [BROWSER CORE]', 'status-ok');
                logInstant('  SIZE: ' + html.length + ' bytes', '');
                logInstant('  STATUS: OK', 'status-ok');
                logInstant('', '');
                loadedCount++;
                updateProgress(100);
                footerStatus.textContent = 'READY';
                return html;
            } catch (err) {
                logInstant('  ERROR: ' + err.message, 'status-err');
                logInstant('  STATUS: FAILED', 'status-err');
                logInstant('', '');
                footerStatus.textContent = 'ERR';
                return null;
            }
        }

        function injectBrowser(html) {
            logInstant('', '');
            logInstant('EXECUTING BROWSER...', 'status-warn');
            logInstant('', '');
            setTimeout(() => {
                document.open();
                document.write(html);
                document.close();
            }, 800);
        }

        async function init() {
            updateProgress(5);
            await typeLine('', '', 0);
            await typeLine('REMOTE REPOSITORY: ' + REPO_OWNER + '/' + REPO_NAME, 'status-info', 8);
            await typeLine('BRANCH: ' + BRANCH, 'status-info', 8);
            await typeLine('CDN: JSDELIVR', 'status-info', 8);
            await typeLine('', '', 0);
            await typeLine('CHECKSUM VERIFICATION: SKIPPED', 'status-warn', 8);
            await typeLine('', '', 0);
            await typeLine('LOADING MODULES:', 'status-info', 8);
            await typeLine('', '', 0);

            updateProgress(10);

            for (const file of FILES) {
                const ok = await loadFile(file);
                if (!ok) {
                    logInstant('FATAL: Module load failure', 'status-err');
                    footerStatus.textContent = 'FATAL';
                    return;
                }
            }

            updateProgress(65);
            await typeLine('LOADING CORE:', 'status-info', 8);
            await typeLine('', '', 0);

            const indexHtml = await loadIndexPage();
            if (indexHtml) {
                updateProgress(100);
                await typeLine('===============================================', 'divider', 5);
                await typeLine('', '', 0);
                await typeLine('ALL MODULES LOADED SUCCESSFULLY', 'status-ok', 10);
                await typeLine('ENGINE STATUS: READY', 'status-ok', 10);
                await typeLine('PRESS [EXECUTE] OR ENTER TO LAUNCH', 'status-warn', 10);

                launchBtn.classList.add('show');
                launchBtn.focus();
                footerStatus.textContent = 'READY';

                launchBtn.addEventListener('click', () => injectBrowser(indexHtml));
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && launchBtn.classList.contains('show')) {
                        e.preventDefault();
                        injectBrowser(indexHtml);
                    }
                });
            } else {
                updateProgress(0);
                await typeLine('CRITICAL: Failed to load browser core', 'status-err');
                footerStatus.textContent = 'FATAL';
            }
        }
        init();
    </script>
</body>
</html>
