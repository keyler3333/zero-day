<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Search Engine</title>
    <style>
        body { font-family: Arial; max-width: 700px; margin: 40px auto; padding: 20px; }
        input[type="text"] { width: 100%; padding: 12px; font-size: 18px; border: 1px solid #ddd; border-radius: 24px; }
        button { padding: 12px 24px; font-size: 16px; background: #1a73e8; color: white; border: none; border-radius: 24px; margin-top: 10px; cursor: pointer; }
        .result { margin: 20px 0; }
        .result a { font-size: 18px; color: #1a0dab; text-decoration: none; }
        .result p { color: #545454; }
    </style>
</head>
<body>
    <h1>My Search Engine</h1>
    <input type="text" id="q" placeholder="Search the web...">
    <button onclick="search()">Search</button>
    <div id="results"></div>
    <script>
        async function search() {
            const q = document.getElementById('q').value;
            const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
            const data = await res.json();
            const resultsDiv = document.getElementById('results');
            if (!data.results.length) {
                resultsDiv.innerHTML = '<p>No results.</p>';
                return;
            }
            resultsDiv.innerHTML = data.results.map(r => `
                <div class="result">
                    <a href="${r.url}" target="_blank">${r.title || r.url}</a>
                    <p>${r.text ? r.text.substring(0, 200) : ''}</p>
                    <small>${r.url}</small> (score: ${r.score})
                </div>
            `).join('');
        }
    </script>
</body>
</html>
